# Production nginx: SPA fallback + same-origin API proxy.
# Runs as the unprivileged `nginx` user on :8080 (no root, no privileged ports).
# Upstream `api:8000` is the compose service name; production ingress
# terminates TLS and routes to the API load balancer instead.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Defense in depth: the API also sets these (SecurityHeadersMiddleware).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # Same-origin API so the browser never needs a cross-origin backend URL.
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /health {
            proxy_pass http://api:8000/health;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
